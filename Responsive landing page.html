<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Navbar</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 2000px; /* for scroll demo */
    }

    /* NAVBAR */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      transition: all 0.3s ease;
      z-index: 1000;
    }

    /* SCROLLED STYLE */
    .navbar.scrolled {
      background: #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .logo {
      color: #fff;
      font-size: 22px;
      font-weight: bold;
    }

    /* MENU */
    .nav-links {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    .nav-links li a {
      text-decoration: none;
      color: white;
      font-size: 16px;
      position: relative;
      transition: color 0.3s ease;
    }

    /* HOVER EFFECT */
    .nav-links li a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -5px;
      width: 0%;
      height: 2px;
      background: #00c3ff;
      transition: width 0.3s ease;
    }

    .nav-links li a:hover {
      color: #00c3ff;
    }

    .nav-links li a:hover::after {
      width: 100%;
    }

    /* HERO SECTION */
    .hero {
      height: 100vh;
      background: linear-gradient(to right, #00c3ff, #ffff1c);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 40px;
    }
  </style>
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="logo">MySite</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

  <section class="hero">
    Scroll Down
  </section>

  <script>
    const navbar = document.getElementById("navbar");

    window.addEventListener("scroll", () => {
      if (window.scrollY > 50) {
        navbar.classList.add("scrolled");
      } else {
        navbar.classList.remove("scrolled");
      }
    });
  </script>

</body>
</html>
